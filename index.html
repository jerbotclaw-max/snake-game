<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; color: #fff; font-family: -apple-system, sans-serif; touch-action: none; overflow: hidden; height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#score { font-size: 1.2rem; margin-bottom: 8px; }
canvas { border: 2px solid #444; border-radius: 8px; display: block; }
#overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); z-index: 10; }
#overlay h1 { font-size: 1.8rem; margin-bottom: 12px; }
#overlay p { font-size: 1rem; opacity: 0.7; margin-bottom: 20px; }
#overlay button { padding: 14px 36px; font-size: 1.1rem; border: none; border-radius: 12px; background: #4CAF50; color: #fff; cursor: pointer; }
#overlay button:active { background: #388E3C; }
</style>
</head>
<body>
<div id="score">Score: 0</div>
<canvas id="c"></canvas>
<div id="overlay">
  <h1>🐍 Snake</h1>
  <p>Swipe to move</p>
  <button id="startBtn">Play</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('score');

const GRID = 20;
let cols, rows, cell;
let snake, dir, nextDir, food, score, running, speed, lastTime;

function resize() {
  const maxW = Math.min(window.innerWidth - 20, 420);
  const maxH = Math.min(window.innerHeight - 100, 600);
  cols = Math.floor(maxW / GRID);
  rows = Math.floor(maxH / GRID);
  cell = Math.min(maxW / cols, maxH / rows);
  canvas.width = cols * cell;
  canvas.height = rows * cell;
}

function init() {
  resize();
  const cx = Math.floor(cols / 2), cy = Math.floor(rows / 2);
  snake = [{x: cx, y: cy}, {x: cx - 1, y: cy}, {x: cx - 2, y: cy}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  speed = 120;
  scoreEl.textContent = 'Score: 0';
  placeFood();
}

function placeFood() {
  let pos;
  do {
    pos = {x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows)};
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function draw() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Food
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  ctx.arc((food.x + 0.5) * cell, (food.y + 0.5) * cell, cell * 0.4, 0, Math.PI * 2);
  ctx.fill();

  // Snake
  snake.forEach((s, i) => {
    const g = i === 0 ? '#4CAF50' : '#2E7D32';
    ctx.fillStyle = g;
    const pad = 1;
    ctx.fillRect(s.x * cell + pad, s.y * cell + pad, cell - pad * 2, cell - pad * 2);
    if (i === 0) {
      ctx.fillStyle = '#fff';
      const ex = (s.x + 0.5 + dir.x * 0.2) * cell;
      const ey = (s.y + 0.5 + dir.y * 0.2) * cell;
      ctx.beginPath();
      ctx.arc(ex, ey, cell * 0.12, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

function step() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // Wrap walls
  if (head.x < 0) head.x = cols - 1;
  if (head.x >= cols) head.x = 0;
  if (head.y < 0) head.y = rows - 1;
  if (head.y >= rows) head.y = 0;

  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = 'Score: ' + score;
    placeFood();
    if (speed > 60) speed -= 2;
  } else {
    snake.pop();
  }
}

function gameOver() {
  running = false;
  overlay.querySelector('h1').textContent = '💀 Game Over';
  overlay.querySelector('p').textContent = 'Score: ' + score;
  document.getElementById('startBtn').textContent = 'Play Again';
  overlay.style.display = 'flex';
}

function loop(ts) {
  if (!running) return;
  if (!lastTime) lastTime = ts;
  if (ts - lastTime >= speed) {
    step();
    draw();
    lastTime = ts;
  }
  requestAnimationFrame(loop);
}

document.getElementById('startBtn').addEventListener('click', () => {
  overlay.style.display = 'none';
  init();
  running = true;
  lastTime = 0;
  requestAnimationFrame(loop);
});

// Swipe
let tx, ty;
canvas.addEventListener('touchstart', e => { e.preventDefault(); tx = e.touches[0].clientX; ty = e.touches[0].clientY; });
canvas.addEventListener('touchmove', e => e.preventDefault());
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) < 15 && Math.abs(dy) < 15) return;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0 && dir.x !== -1) nextDir = {x: 1, y: 0};
    else if (dx < 0 && dir.x !== 1) nextDir = {x: -1, y: 0};
  } else {
    if (dy > 0 && dir.y !== -1) nextDir = {x: 0, y: 1};
    else if (dy < 0 && dir.y !== 1) nextDir = {x: 0, y: -1};
  }
});

// Keyboard
document.addEventListener('keydown', e => {
  const map = {ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
  const d = map[e.key];
  if (d && (d.x + dir.x !== 0 || d.y + dir.y !== 0)) nextDir = d;
});

resize();
init();
draw();
</script>
</body>
</html>
